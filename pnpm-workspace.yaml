# pnpm reads its settings from this file. An equivalent "pnpm" block in
# package.json is silently ignored, so settings belong here.

# Minutes — 10080 is 7 days. Under the pnpm 10 this repo pins, this value is the
# whole window: 10's cooldown only exists once the key is set, where pnpm 11
# waits 1 day by default. Widened either way, since compromised releases are
# usually caught and pulled within hours. `pnpm install --trust-lockfile` skips
# the check, but it trusts every entry at once, so the targeted exclusion below
# is preferred.
minimumReleaseAge: 10080

# Inert under the pnpm 10 this repo pins, which knows only the two keys above
# and below and ignores unknown keys silently. Kept deliberately for the day
# packageManager moves to pnpm 11 (zendesk-mcp-cloudflare already has): there it
# makes the install fail when no version satisfies the window, rather than
# quietly falling back to one that doesn't.
minimumReleaseAgeStrict: true

# Pinned to the exact version rather than the bare package name, which would
# exempt every future release too. Scoped this way each entry expires by
# itself: the next release goes back through the full wait.
#
# These pins are copied from zendesk-mcp-cloudflare, whose lockfile these
# modules were developed against. The oauth-provider entry exists because 0.8.3
# (published 2026-07-29) was adopted there while still inside the window above,
# and lockfile verification rejects it on a fresh install.
#
# The five below that are zendesk-mcp-cloudflare#40, the move to MCP revision
# 2026-07-28. The spec and all of its implementations were published within a
# day of each other on 2026-07-27 and 2026-07-28, so waiting the window out
# means running a deprecated transport for a week rather than avoiding an
# unvetted release.
#
# Only `server` is imported by this package. The rest are transitive: `server`
# pins `core` exactly, and `client` and the v1 `sdk` are both auto-installed
# peers of `agents`. The v1 entry is the surprising one and it is not a
# leftover — `agents` still carries the deprecated McpAgent next to the
# stateless handler, and that half is built on v1, so upgrading does not get us
# off the old SDK. It leaves when McpAgent does.
#
# `agents` is here for the opposite reason, and it is the trap worth knowing
# about: ^0.20.0 has no member old enough to pass, but asking for
# `agents@latest` does not fail — it quietly resolves to 0.18.0, which predates
# createMcpHandler entirely.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-oauth-provider@0.8.3'
  - '@modelcontextprotocol/server@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/sdk@1.30.0'
  - 'agents@0.20.1'

# pnpm 11 fails the install outright (ERR_PNPM_IGNORED_BUILDS) unless every
# package with an install script is answered here; the pnpm 10 this repo pins
# skips unanswered scripts with a warning instead, so the answers matter on
# both. esbuild arrives with vitest and fetches a prebuilt platform binary.
#
# core-js-pure is denied rather than permitted, and it is the one entry here
# that is not a build at all: its postinstall prints a funding notice and
# swallows its own errors, so nothing depends on it having run. It arrives with
# agents, four levels down through mimetext, an email library that has nothing
# to do with MCP.
allowBuilds:
  core-js-pure: false
  esbuild: true

# Reinstall when node_modules has drifted from the lockfile, rather than only
# complaining. This repo has no pre-commit hooks, so it is the only local
# guard. `install` rather than `error` because editing minimumReleaseAgeExclude
# above marks node_modules stale, so `error` would fail the next script run
# with ERR_PNPM_VERIFY_DEPS_BEFORE_RUN the moment someone deletes a pinned
# entry.
verifyDepsBeforeRun: install
